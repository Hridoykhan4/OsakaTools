services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: ${MONGODB_URI:?}
      # Isolated OSAKA TOOL database. The API refuses to start against osaka_toyo.
      MONGODB_DB: ${MONGODB_DB:-osaka_tool}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-OsakaTool}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://osakatool.com}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-staging}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-sales@osakatool.com}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
        API_INTERNAL_URL: http://backend:5000/api
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      API_INTERNAL_URL: http://backend:5000/api
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
